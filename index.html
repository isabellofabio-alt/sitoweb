<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il nostro album</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
  <header>
    <div class="names"><span id="n1" contenteditable="true" spellcheck="false" role="textbox" aria-label="Il tuo nome">Io</span> <span class="amp">&amp;</span> <span id="n2" contenteditable="true" spellcheck="false" role="textbox" aria-label="Il suo nome">Te</span></div>
    <div class="since" id="since"></div>
  </header>

  <div class="bar">
    <button class="btn main" id="add">＋ Aggiungi foto</button>
    <button class="btn" id="play">▶ Guarda il nostro film</button>
    <button class="btn" id="love">♥ Ti amo</button>
    <button class="btn" id="lock">🔒 Modifica</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>

  <form class="login" id="login"><input type="password" id="pw" placeholder="Password per modificare" autocomplete="current-password" aria-label="Password"><button class="btn main" type="submit">Entra</button></form>
  <div class="drop" id="drop"><strong>Qui iniziano i nostri ricordi</strong><span>Trascina le vostre foto in questa pagina oppure premi “Aggiungi foto”.</span></div>
  <main class="grid" id="grid" aria-label="Album di foto"></main>
  <p class="note" id="note"></p>
</div>

<dialog id="dlg" aria-label="Foto ingrandita">
  <div class="lb">
    <button class="x" id="close" aria-label="Chiudi">✕</button>
    <button class="p" id="prev" aria-label="Foto precedente">‹</button>
    <figure><img id="big" alt=""><figcaption id="bigcap"></figcaption></figure>
    <button class="n" id="next" aria-label="Foto successiva">›</button>
  </div>
</dialog>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script src="script.js?v=3"></script>

</body>
</html>
